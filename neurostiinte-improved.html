    const hashString = (str) => {
      let hash = 0;
      for (let i = 0; i < str.length; i++) {
        const char = str.charCodeAt(i);
        hash = ((hash << 5) - hash) + char;
        hash = hash & hash; // Convert to 32bit integer
      }
      return Math.abs(hash).toString(36);
    };

      { q: "Ce rol au celulele orizontale?", a: "Comunicare indirectă între fotoreceptori și neuronii bipolari.", m: "M6" },

      { q: "Care sunt tipurile de celule ganglionare după proprietăți?", a: "Tip M (câmp mare, rafală scurtă), tip P (PA pe toată durata), tip nonM-nonP.", m: "M6" },
      { q: "Ce caracterizează celulele ganglionare de tip M?", a: "Câmp receptor mare, descărcare scurtă.", m: "M6" },

      { q: "Ce este chiasma optică?", a: "Locul unde o parte din fibrele nervului optic se încrucișează spre emisfera contralaterală.", m: "M6" },
      { q: "Ce procent din fibrele nervului optic se încrucișează?", a: "Aproximativ jumătate.", m: "M6" },

      { q: "Câte straturi au NGL?", a: "6 straturi (numerotate de la ventral la dorsal, 1-6).", m: "M6" },
      { q: "Ce straturi NGL procesează informație de la ochiul ipsilateral?", a: "Straturile 2, 3 și 5.", m: "M6" },

      { q: "Ce tip de câmpuri receptoare au neuronii NGL?", a: "Tot ON/OFF, similare cu celulele ganglionare.", m: "M6" },
      { q: "Ce este cortexul vizual primar (V1)?", a: "Aria Brodmann 17, în lobul occipital. Mai e numit cortex striat.", m: "M6" },
      { q: "Unde ajung majoritatea aferențelor din NGL în V1?", a: "La nivelul stratului 4C.", m: "M6" },

      { q: "Sunt neuronii din stratul 4C monoculari sau binoculari?", a: "MONOCULARI.", m: "M6" },
      { q: "Ce tipuri de sinapse intracorticale există în V1?", a: "Radiale (între straturi diferite) și orizontale (în același strat).", m: "M6" },

      { q: "Ce detectează celulele simple din V1?", a: "Orientarea și POZIȚIA unei linii.", m: "M6" },

      { q: "Ce detectează celulele hipercomplexe?", a: "Orientarea, mișcarea și LUNGIMEA unei linii.", m: "M6" },
      { q: "Care este rolul comun al celulelor simple, complexe și hipercomplexe?", a: "Detectarea contururilor.", m: "M6" },
      { q: "Ce sunt bulele din V1?", a: "Coloane de neuroni bogați în citocrom oxidază. Neuronii din bule sunt sensibili la CULORI.", m: "M6" },

      { q: "Ce este cortexul extrastriat (V2)?", a: "Principala țintă a proiecțiilor din V1.", m: "M6" },
      { q: "Ce tipuri de dungi are V2?", a: "Dungi late, subțiri (închise la culoare) și dungi pale (deschise).", m: "M6" },
      { q: "Ce proiectează stratul 4B din V1 în V2?", a: "Dungile late - procesează adâncimea și mișcarea.", m: "M6" },
      { q: "Ce proiectează bulele din V1 în V2?", a: "Dungile subțiri - procesează culoarea.", m: "M6" },
      { q: "Ce proiectează regiunile dintre bule din V1 în V2?", a: "Dungile pale - procesează forma (celule hipercomplexe).", m: "M6" },
      { q: "Ce este rețeaua vizuală dorsală?", a: "Dinspre V2 spre parietal - ghidarea vizuală a mișcării ('unde').", m: "M6" },
      { q: "Ce este rețeaua vizuală ventrală?", a: "Dinspre V2 spre temporal - identificarea obiectelor ('ce').", m: "M6" },

      { q: "Care sunt cele 3 componente ale modelului cub de gheață?", a: "Coloane de dominanță oculară, coloane de orientare, bule.", m: "M6" },

      { q: "Sunt rețelele vizuale organizate ierarhic?", a: "DA - de la module care procesează trăsături simple la reprezentări complexe.", m: "M6" },

      { q: "Ce este gradientul electrochimic?", a: "Suma dintre gradientul de concentrație și presiunea electrostatică - determină direcția netă de mișcare a ionilor prin membrană.", m: "M3" },
      { q: "Pentru K+, gradientul electrochimic acționează într-o direcție clară?", a: "NU - gradientul de concentrație împinge K+ spre exterior, iar presiunea electrostatică spre interior (forțe opuse, echilibrate la -70mV).", m: "M3" },
      { q: "Pentru Na+, gradientul electrochimic acționează într-o direcție clară?", a: "DA - AMBELE forțe (gradient de concentrație + presiune electrostatică) împing Na+ spre interior celulei.", m: "M3" },
      { q: "De ce Na+ NU intră masiv în celulă în repaus?", a: "Pentru că membrana are permeabilitate FOARTE SCĂZUTĂ pentru Na+ în repaus (puține canale deschise permanent).", m: "M3" },
      { q: "Ce proteină motorie asigură transportul anterograd în axon?", a: "Kinesina - deplasează veziculele de la corpul celular spre terminații axonice, consumând ATP.", m: "M2" },
      { q: "Ce proteină motorie asigură transportul retrograd în axon?", a: "Dineina - deplasează veziculele de la terminații spre corpul celular, consumând ATP.", m: "M2" },
      { q: "Pe ce 'șine' se deplasează proteinele motorii în axon?", a: "Pe microtubuli - structuri cilindrice formate din tubulină, dispuse paralel de-a lungul axonului.", m: "M2" },
      { q: "De ce este important transportul retrograd?", a: "Pentru reciclarea membranei și comunicarea retrogradă (de la sinapsă la nucleu) pentru reglarea expresiei genelor.", m: "M2" },
      { q: "Care este principalul neurotransmițător excitator în SNC?", a: "Glutamatul - responsabil pentru majoritatea transmisiei excitatoare din creier.", m: "M3" },
      { q: "Care este principalul neurotransmițător inhibitor în SNC?", a: "GABA (acid gama-aminobutiric) - responsabil pentru majoritatea transmisiei inhibitorii.", m: "M3" },
      { q: "Care sunt neurotransmițătorii din clasa aminoacizilor?", a: "Glutamat (excitator), GABA și glicină (inhibitori), aspartat (excitator).", m: "M3" },
      { q: "Care sunt neurotransmițătorii din clasa monoaminelor?", a: "Catecolamine (dopamină, noradrenalină, adrenalină) și indolamine (serotonină). Plus histamina.", m: "M3" },
      { q: "Ce caracterizează neurotransmițătorii peptidici?", a: "Sunt lanțuri de aminoacizi (endorfine, substanța P, oxitocină). Acționează mai lent, dar efectul este mai prelungit decât NT de molecule mici.", m: "M3" },
      { q: "De ce conducerea saltatorie este mai rapidă decât cea continuă?", a: "PA 'sare' de la un nod Ranvier la altul (regenerare doar la noduri), fără să trebuiască regenerat pe toată lungimea axonului.", m: "M3" },
      { q: "De ce conducerea saltatorie este mai eficientă energetic?", a: "Pompele Na+/K+ trebuie să funcționeze doar la nodurile Ranvier (refacerea gradienților), nu pe toată lungimea axonului mielinizat.", m: "M3" },
      { q: "Ce se întâmplă între nodurile Ranvier în conducerea saltatorie?", a: "PA se propagă pasiv (decremental) sub mielină, dar ajunge la nodul următor cu amplitudine suficientă pentru a fi regenerat.", m: "M3" },
      { q: "Ce fac potențialele postsinaptice excitatoare (PPE)?", a: "Depolarizează membrana (fac interiorul mai puțin negativ), crescând probabilitatea declanșării PA.", m: "M3" },
      { q: "Ce fac potențialele postsinaptice inhibitorii (PPI)?", a: "Hiperpolarizează membrana (fac interiorul mai negativ) sau o mențin la potențialul de repaus, scăzând probabilitatea PA.", m: "M3" },
      { q: "Ce înseamnă sumație spațială a potențialelor postsinaptice?", a: "Potențialele de la multiple sinapse diferite se adună (sumează) simultan pe membrana neuronului postsinaptic.", m: "M3" },
      { q: "Ce înseamnă sumație temporală a potențialelor postsinaptice?", a: "Potențiale repetate rapid de la aceeași sinapsă se adună înainte ca precedentele să dispară complet.", m: "M3" },
      { q: "Care sunt zonele funcționale ale neuronului în ordine?", a: "1) Zona receptoare (dendrite + corp celular), 2) Zona integrativă (con axonic), 3) Zona conducătoare (axon), 4) Zona efectoare (terminații axonice).", m: "M2" },
      { q: "Unde se integrează (sumează) toate semnalele într-un neuron?", a: "În conul axonic (hillock) - aici se decide dacă suma PP atinge pragul și se generează PA.", m: "M2" },
      { q: "De ce se numește 'model tripartit' al sinapsei?", a: "Pentru că include 3 componente active: membrana presinaptică, membrana postsinaptică și astrocitul perisinpatic.", m: "M2" },
      { q: "Ce rol specific are astrocitul în modelul tripartit al sinapsei?", a: "Recaptează excesul de neurotransmițători (în special glutamat și GABA) din fanta sinaptică, reglând intensitatea și durata semnalului.", m: "M2" },
      { q: "Care sunt pașii eliberării neurotransmițătorului la sinapsă?", a: "1) PA ajunge la terminal, 2) Se deschid canale Ca2+ voltaj-dependente, 3) Ca2+ intră, 4) Veziculele fuzionează cu membrana (exocitoză), 5) NT eliberat în fantă.", m: "M3" },
      { q: "Ce rol are Ca2+ în transmisia sinaptică?", a: "Influxul de Ca2+ în terminalul presinaptic este semnalul care declanșează fuziunea veziculelor și eliberarea neurotransmițătorilor (exocitoza).", m: "M3" },
      { q: "Care sunt funcțiile principale ale lobului frontal?", a: "Control motor (cortex motor primar în girusul precentral), funcții executive, planificare, luare de decizii, limbaj expresiv (aria Broca).", m: "M4" },
      { q: "Care sunt funcțiile principale ale lobului parietal?", a: "Procesare senzorială somatică (cortex somatosenzorial primar în girusul postcentral), integrare senzorială multim", m: "undefined" },
      { q: "Care sunt funcțiile principale ale lobului parietal?", a: "Procesare senzorială somatică (cortex somatosenzorial primar), integrare senzorială multimodală, atenție spațială, reprezentare corporală.", m: "M4" },
      { q: "Care sunt funcțiile principale ale lobului temporal?", a: "Auz (cortex auditiv primar), limbaj receptiv (aria Wernicke), memorie declarativă (hipocamp), recunoaștere facială și obiecte.", m: "M4" },
      { q: "Care sunt funcțiile principale ale lobului occipital?", a: "Procesare vizuală - cortex vizual primar (V1/aria 17) și arii vizuale secundare (V2, V3, V4, V5/MT).", m: "M4" },
      { q: "Cum circulă lichidul cefalo-rahidian prin sistemul ventricular?", a: "Ventriculii laterali → foramen interventricular (Monro) → ventriculul III → apeductul cerebral (Sylvius) → ventriculul IV → spațiul subarahnoidian.", m: "M4" },
      { q: "Prin ce structură comunică ventriculii laterali cu ventriculul III?", a: "Foramen interventricular (foramen Monro) - deschidere bilaterală de comunicare.", m: "M4" },
      { q: "Prin ce structură comunică ventriculul III cu ventriculul IV?", a: "Apeductul cerebral (apeductul Sylvius) - canal îngust prin mezencefal.", m: "M4" },
      { q: "Ce înseamnă planul sagital medial?", a: "Secțiune sagitală care împarte creierul exact la mijloc în două jumătăți egale (stânga și dreapta).", m: "M4" },
      { q: "Ce structuri vezi într-o secțiune sagitală mediană prin creier?", a: "Corpul calos, fornixul, ventriculul III, mezencefalul, puntea, bulbul, cerebelul, comisura anterioară.", m: "M4" },
      { q: "Ce vezi într-o secțiune coronală (frontală) prin creier?", a: "Cortexul cerebral în secțiune transversală, ventriculii (lateral/III/IV), nucleii bazali, talamus, hipocamp (în funcție de nivel).", m: "M4" },
      { q: "De ce celulele morulei sunt totipotențiale?", a: "Pot forma ORICE tip de celulă, inclusiv placenta (trofoblast) și toate țesuturile fetale - pot genera un organism complet.", m: "M5" },
      { q: "De ce celulele embrioblastului (masa celulară internă) sunt doar pluripotențiale?", a: "Pot forma multe tipuri de celule din toate cele 3 foițe embrionare, dar NU pot forma placenta (trofoblast).", m: "M5" },
      { q: "Ce exemplu demonstrează totipotențialitatea?", a: "Gemenii monozigoți (identici) - o celulă din morulă se poate diviza și fiecare parte formează un individ complet.", m: "M5" },
      { q: "Cum se transformă placa neurală în tub neural?", a: "Placa neurală se îndoaie formând șanțul neural, marginile se ridică și se apropie, apoi fuzionează formând tubul neural închis.", m: "M5" },
      { q: "Ce se întâmplă dacă neuroporul caudal nu se închide?", a: "Spina bifida - defect de închidere a tubului neural la nivel lombar/sacrat, variind de la forme ușoare la severe.", m: "M5" },
      { q: "Ce se întâmplă dacă neuroporul rostral nu se închide?", a: "Anencefalie - defect grav la nivelul creierului, incompatibil cu viața (mare parte din creier nu se dezvoltă).", m: "M5" },
      { q: "Ce structuri derivă din telencefalul (veziculă cerebrală secundară)?", a: "Cortexul cerebral, hipocampul, nucleii bazali (striatum, globus pallidus), bulbii olfactivi.", m: "M5" },
      { q: "Ce structuri derivă din diencefalul (veziculă secundară)?", a: "Talamusul, hipotalamusul, epitalamusul (epifiza/glanda pineală), subtalamusul, retina.", m: "M5" },
      { q: "Ce structuri derivă din mezencefalul?", a: "Coliculii cvadrigemeni (superiori și inferiori), pedunculii cerebrali, substanța neagră, nucleul roșu.", m: "M5" },
      { q: "Când se întrerupe sinaptogeneza?", a: "NU se întrerupe în adolescență - continuă și după naștere, în special în cortexul frontal (până în adolescență târzie).", m: "M5" },
      { q: "Când se întrerupe mielinizarea?", a: "NU se întrerupe în adolescență - continuă și în perioada adultă timpurie, mai ales în tracturile de asociație corticală.", m: "M5" },
      { q: "Ce proces de dezvoltare a SN este predominant prenatal?", a: "Neurogeneza și migrarea neuronală sunt predominant prenatale (cu excepții minore în hipocamp și bulbii olfactivi).", m: "M5" },
      { q: "În ce ordine apar procesele majore de dezvoltare a SN?", a: "1) Neurogeneza, 2) Migrare, 3) Diferențiere, 4) Sinaptogeneză, 5) Mielinizare, 6) Apoptoză/pruning sinpatic (peste toate etapele).", m: "M5" },
      { q: "Ce înseamnă că cortexul vizual primar este organizat retinotopic?", a: "Neuroni adiacenți în cortex procesează informație de la zone adiacente din retină - harta spațială a câmpului vizual este păstrată.", m: "M6" },
      { q: "De ce câmpul vizual drept este procesat în hemisfera stângă?", a: "Retina nazală din ochiul drept și retina temporală din ochiul stâng (care văd câmpul vizual drept) proiectează ambele în hemisfera stângă.", m: "M6" },
      { q: "Ce parte a retinei decusează (traversează) la chiasma optică?", a: "Doar axonii celulelor ganglionare din retina nazală (jumătatea apropiată de nas) - retina temporală rămâne ipsilaterală.", m: "M6" },
      { q: "Ce diferențiază celulele simple de cele complexe în cortexul vizual?", a: "Celulele simple răspund la linii într-o poziție precisă din câmpul receptiv. Celulele complexe răspund la linii în ORICE poziție (insensibile la poziția exactă).", m: "M6" },
      { q: "Ce adaugă celulele hipercomplexe față de cele complexe în V1?", a: "Sensibilitate la orientare, poziție ȘI lungime specifică a liniei - au inhibiție la capete (end-stopped). Unele detectează și direcția mișcării.", m: "M6" },
      { q: "Cum se numește organizarea neuronilor în cortexul vizual V1?", a: "În coloane de orientare - neuroni dintr-o coloană verticală (perpendiculară pe suprafața cortexului) răspund la linii cu aceeași orientare.", m: "M6" },
      { q: "Unde axonii neuronilor ganglionari din retină?", a: "Formează nervul optic, trec prin chiasma optică (unde unii decusează), apoi tractul optic până la nucleii geniculați laterali (NGL) din talamus.", m: "M6" },
      { q: "Ce sunt coloanele de dominanță oculară în V1?", a: "Coloane de neuroni care răspund preferențial la inputuri de la UN ochi (drept sau stâng) - alternează pe suprafața cortexului.", m: "M6" },
      { q: "Unde are loc sinteza proteinelor în neuron?", a: "În corpul celular (reticulul endoplasmatic rugos cu ribozomi = corpusculi Nissl) și în dendrite (poliribozomi liberi). NU în axon.", m: "M2" },
      { q: "De ce axonul NU poate sintetiza proteine local?", a: "Pentru că axonul nu conține ribozomi - toate proteinele necesare trebuie transportate din corpul celular prin transport axoplasmatic.", m: "M2" },
      { q: "Ce particularitate au dendritele față de axon în privința sintezei proteice?", a: "Dendritele conțin poliribozomi (ribozomi liberi) și pot sintetiza proteine local, important pentru plasticitatea sinaptică. Axonul NU poate.", m: "M2" },
      { q: "Ce sunt corpusculii Nissl (corpi tigroizi)?", a: "Agregate de reticul endoplasmatic rugos (cu ribozomi atașați) în corpul celular al neuronului - vizibile la colorația Nissl, responsabili pentru sinteza proteinelor.", m: "M2" },
      { q: "Cum a fost rezolvată definitiv dezbaterea dintre teoria reticulară și teoria neuronului?", a: "Prin microscopul electronic în anii 1950, care a arătat că există spațiu (fanta sinaptică de 20-40 nm) între procesele neuronale - nu sunt continui.", m: "M1" },
      { q: "De ce perspectiva lui Golgi (teoria reticulară) părea plauzibilă inițial?", a: "Tehnicile de colorație și limitările microscopiei optice nu puteau evidenția fanta sinaptică (prea mică, ~20-40 nm) - părea că neuronii sunt continui.", m: "M1" },
      { q: "Ce tehnologie limitată a dus la teoria reticulară a lui Golgi?", a: "Limitările rezoluției microscopiei optice (limită ~200 nm) - nu putea vizualiza fanta sinaptică de 20-40 nm.", m: "M1" },
      { q: "Ce rol au microgliele în SN?", a: "Rol similar cu sistemul imun - răspund la leziuni/infecții prin fagocitoză (curățare resturi celulare) și declanșare de răspunsuri inflamatoare.", m: "M2" },
      { q: "Când intră microgliele în SNC?", a: "În perioada fetală, ÎNAINTE de formarea barierei hemato-encefalice - după aceea, bariera previne intrarea lor din circulație.", m: "M2" },
      { q: "Cum răspund microgliele la leziuni cerebrale?", a: "Prin fagocitoză (înghit și digeră resturi celulare, debris neuronal, celule moarte) și prin eliberare de citokine (moleculare inflamatorii).", m: "M2" },
      { q: "Unde se găsesc celulele ependimale?", a: "Pe pereții ventriculilor cerebrali și în plexurile coroide (structuri vasculare din interiorul ventriculilor).", m: "M2" },
      { q: "Ce produc celulele ependimale din plexurile coroide?", a: "Aproximativ două treimi (2/3) din lichidul cefalo-rahidian (LCR) - prin filtrare și secreție activă.", m: "M2" },
      { q: "Cum protejează LCR-ul SNC?", a: "1) Protecție mecanică (amortizare împotriva șocurilor), 2) Nutriție (transportă nutrienți), 3) Eliminare reziduuri metabolice.", m: "M2" },
      { q: "Ce se întâmplă când membrana se depolarizează la pragul de declanșare?", a: "Se deschid masiv canalele de Na+ voltaj-dependente (feedback pozitiv), ducând la influx rapid de Na+ și inversarea polarității (PA).", m: "M3" },
      { q: "De ce perioada refractară absolută este 'absolută'?", a: "Este IMPOSIBIL să declanșezi un nou PA când canalele de Na+ sunt în stare inactivată (în timpul depolarizării și repolarizării timpurii).", m: "M3" },
      { q: "Care este frecvența maximă de PA permisă de perioada refractară absolută?", a: "Aproximativ 1000 PA/secundă (1 PA la fiecare ~1 ms), deoarece perioada refractară absolută durează ~1-2 ms.", m: "M3" },
      { q: "De ce PP (potențiale postsinaptice) sunt nepropagabile?", a: "Rezultă dintr-un schimb modest de ioni (câțiva mV), ionii se dispersează în spațiul vast din neuron - semnalul slăbește rapid (conducere cu decrement).", m: "M3" },
      { q: "De ce PA (potențiale de acțiune) sunt propagabile?", a: "Rezultă dintr-un schimb MASIV de ioni prin deschiderea în avalanșă a canalelor voltaj-dependente - se auto-regenerează la fiecare punct (conducere fără decrement).", m: "M3" },
      { q: "Ce sunt receptorii ionotropi?", a: "Receptori postsinaptici care au canal ionic integrat - când NT se leagă, canalul se deschide DIRECT și RAPID (milisecunde).", m: "M3" },
      { q: "Ce sunt receptorii metabotropi?", a: "Receptori postsinaptici cuplați la proteine G - când NT se leagă, activează cascade de semnalizare intracelulară (mesageri secundari). Efect mai LENT dar mai PRELUNGIT.", m: "M3" },
      { q: "Ce se întâmplă după ce NT se leagă de un receptor ionotropic?", a: "Canalul ionic se deschide IMEDIAT → influx/eflux de ioni → schimbare rapidă a potențialului de membrană (PPE sau PPI).", m: "M3" },
      { q: "Ce se întâmplă după ce NT se leagă de un receptor metabotropic?", a: "Se activează o proteină G → aceasta activează enzime → producere mesageri secundari (cAMP, IP3, DAG) → efecte diverse și prelungite în celulă.", m: "M3" },
      { q: "Cum sunt eliminați neurotransmițătorii din fanta sinaptică?", a: "1) Degradare enzimatică în fantă (ex: acetilcolinesteraza degradează ACh), 2) Recaptare în neuronul presinaptic, 3) Captare în astrocite perisinaptice.", m: "M3" },
      { q: "Ce sunt transportorii de neurotransmițători?", a: "Proteine transmembranare specializate care reintroduc NT din fanta sinaptică în citoplasma neuronului presinaptic (recaptare) pentru reciclare.", m: "M3" },
      { q: "De ce este importantă recaptarea neurotransmițătorilor?", a: "1) Oprește rapid semnalul (clearance), 2) Economisește energie (reciclare NT), 3) Previne supraexcitarea/inhibirea (reglare precisă).", m: "M3" },
      { q: "Ce sunt meningele și care e rolul lor?", a: "Cele 3 membrane (dura mater, arahnoidă, pia mater) care învelesc și protejează SNC împotriva traumatismelor și infecțiilor.", m: "M4" },
      { q: "Care meningă conține sinusuri pentru drenajul sanguin venos?", a: "Dura mater (cea mai exterioară și rezistentă) - conține sinusuri durale unde e drenat sângele venos din creier.", m: "M4" },
      { q: "Unde se află spațiul subarahnoidian și ce conține?", a: "Între arahnoidă și pia mater - conține LCR și vase de sânge majore (artere cerebrale), oferind protecție mecanică și nutriție.", m: "M4" },
      { q: "Care meningă este în contact direct cu suprafața creierului?", a: "Pia mater (cea mai internă și subțire) - aderă strâns la suprafața creierului, urmând toate girusurile și șanțurile.", m: "M4" },
      { q: "Ce este zona ventriculară în dezvoltarea SN?", a: "Stratul de celule neuroepiteliale care căptușește tubul neural - ZON", m: "undefined" },
      { q: "Ce este zona ventriculară în dezvoltarea creierului?", a: "Stratul de celule neuroepiteliale care căptușește tubul neural - ZONA PRINCIPALĂ de neurogenă (unde se nasc neuronii prin diviziune celulară).", m: "M5" },
      { q: "Ce este migrarea neuronală radială?", a: "Neuronii migrează de la zona ventriculară spre suprafața cortexului, ghidați de celule gliale radiale (care formează 'schelă'). Tipul principal de migrare în cortex.", m: "M5" },
      { q: "Ce este migrarea neuronală tangențială?", a: "Neuroni migrează paralel cu suprafața cortexului, NU perpendicular. Tipică pentru interneuronii GABAergici care migrează din eminențele ganglionare.", m: "M5" },
      { q: "În ce ordine se formează straturile cortexului cerebral?", a: "De jos în sus (inside-out pattern) - neuronii mai vechi formează straturi profunde (VI), cei noi 'trec peste' și formează straturi superficiale (până la II).", m: "M5" },
      { q: "Ce sunt factori de creștere neuronali și ce fac?", a: "Proteine (ex: NGF, BDNF) care promovează supraviețuirea, creșterea și diferențierea neuronilor. Esențiale pentru dezvoltare și neuroplasticitate.", m: "M5" },
      { q: "Ce este NGF (nerve growth factor)?", a: "Primul factor de creștere descoperit (Rita Levi-Montalcini) - promovează supraviețuirea și creșterea neuronilor senzoriali și simpatici.", m: "M5" },
      { q: "Ce este BDNF (brain-derived neurotrophic factor)?", a: "Factor de creștere similar NGF, dar specific pentru neuroni din creier - important pentru neuroplasticitate, învățare și memorie.", m: "M5" },
      { q: "Ce este apoptoza neuronală în dezvoltare?", a: "Moarte celulară programată - până la 50% din neuroni mor în dezvoltare (cei care nu fac sinapse funcționale sau nu primesc suficienți factori de creștere).", m: "M5" },
      { q: "De ce este importantă apoptoza în dezvoltarea SN?", a: "Elimină neuronii care au făcut conexiuni greșite sau sunt în exces, rafinând circuitele neuronale - 'sculptează' rețelele neuronale.", m: "M5" },
      { q: "Ce este pruning-ul sinaptic?", a: "Eliminarea sinapselor nefolosite sau slabe în dezvoltare/adolescență - perfecționează circuitele neuronale prin principiul 'use it or lose it'.", m: "M5" },
      { q: "Când are loc pruning-ul sinaptic masiv?", a: "În copilărie timpurie (0-3 ani) și în adolescență (10-20 ani) - se elimină până la 40% din sinapse, mai ales în cortexul frontal.", m: "M5" },
      { q: "Ce sunt bulele (blobs) din cortexul vizual V1?", a: "Coloane de neuroni bogate în enzima citocrom oxidază. Neuronii din bule sunt sensibili la CULOARE, cei dintre bule procesează formă/orientare.", m: "M6" },
      { q: "Ce este rețeaua vizuală dorsală ('unde')?", a: "Dinspre V1/V2 spre cortexul parietal posterior - procesează LOCALIZARE SPAȚIALĂ și ghidarea vizuală a mișcării (reaching, grasping).", m: "M6" },
      { q: "Ce este rețeaua vizuală ventrală ('ce')?", a: "Dinspre V1/V2 spre cortexul temporal inferior - procesează IDENTIFICAREA OBIECTELOR, recunoaștere facială, culoare.", m: "M6" },
      { q: "Ce structuri formează retina (în ordine de la exterior)?", a: "Epiteliu pigmentar → fotoreceptori → celule bipolare → celule ganglionare (+ celule orizontale și amacrine). Lumina traversează tot până la fotoreceptori.", m: "M6" },
      { q: "Ce este fototransducția?", a: "Procesul de convertire a luminii în semnal electric în fotoreceptori - lumina → izomerizare retinină → cascade cu proteină G → închiderea canalelor de Na+ → hiperpolarizare.", m: "M6" },
      { q: "De ce fotoreceptorii se hiperpolarizează la lumină (nu depolarizează)?", a: "În întuneric canalele de Na+ sunt DESCHISE (curent întunecat) - lumina ÎNCHIDE aceste canale → hiperpolarizare. Mecanismus neobișnuit pentru o celulă senzorială.", m: "M6" },
      { q: "Care este diferența principală între bastonașe și conuri?", a: "Bastonașe: foarte sensibile (văz nocturn), saturează la lumină mare, nu diferențiază culori. Conuri: necesită lumină puternică, diferențiază culori (3 tipuri).", m: "M6" },
      { q: "Câte tipuri de conuri există și ce culori detectează?", a: "3 tipuri: conuri S (short - albastru/violet, ~420nm), M (medium - verde, ~530nm), L (long - roșu, ~560nm). Compararea semnalelor = percepție culoare.", m: "M6" },
      { q: "Ce sunt câmpurile receptive centru-periferie?", a: "Organizare a câmpurilor receptive ale celulelor ganglionare și bipolare - centru excitator/periferie inhibitorie SAU invers. Detectează contraste.", m: "M6" },
      { q: "Ce sunt celulele ganglionare de tip M (magnocelulare)?", a: "Celule cu câmpuri receptive mari, răspuns tranzitoriu (la schimbare), sensibile la mișcare și contrast scăzut. Proiectează în straturile magnocelulare ale NGL.", m: "M6" },
      { q: "Ce sunt celulele ganglionare de tip P (parvocelulare)?", a: "Celule cu câmpuri receptive mici, răspuns susținut, sensibile la culoare și detalii fine. Proiectează în straturile parvocelulare ale NGL (mai numeroase).", m: "M6" },
      { q: "Unde ajunge informația vizuală după NGL (nucleii geniculați laterali)?", a: "Prin radiațiile optice (axonii neuronilor din NGL) până la cortexul vizual primar V1 (aria 17) în lobul occipital.", m: "M6" },

      { q: "Câte bule (blobs) conține un modul cortical din V1?", a: "Aproximativ 16 bule, fiecare de ~0.2mm diametru, dispuse regular - detectabile prin colorația cu citocrom oxidază.", m: "M6" },

      else {
        if (repetitions === 0) interval = 1;
        else if (repetitions === 1) interval = 3;
        else interval = Math.round(interval * easeFactor);
        repetitions += 1;
      }
      easeFactor = Math.max(1.3, easeFactor + (0.1 - (5 - quality) * (0.08 + (5 - quality) * 0.02)));
      const nextReview = new Date();
      nextReview.setDate(nextReview.getDate() + interval);
      return { ...card, interval, easeFactor, repetitions, nextReview: nextReview.toISOString(), lastReview: new Date().toISOString() };
