            <rect x="90" y="180" width="40" height="30" rx="5" fill="#22c55e" stroke="#15803d" stroke-width="2"/>
            <rect x="270" y="180" width="40" height="30" rx="5" fill="#22c55e" stroke="#15803d" stroke-width="2"/>
          </g>
          <g id="v1" class="diagram-part">
            <rect x="150" y="240" width="100" height="40" rx="8" fill="#a855f7" stroke="#7c3aed" stroke-width="2"/>
          </g>
        </svg>`
      }
    ];

    const ACHIEVEMENTS = [
      // Progress achievements
      { id: "first-steps", name: "Primii Pași", desc: "Studiază 10 carduri", icon: "🌱", xp: 50, condition: (stats) => stats.studiedCards >= 10 },
      { id: "serious-student", name: "Student Serios", desc: "Studiază 50 carduri", icon: "📚", xp: 100, condition: (stats) => stats.studiedCards >= 50 },
      { id: "dedicated", name: "Dedicat", desc: "Studiază 100 carduri", icon: "🎓", xp: 200, condition: (stats) => stats.studiedCards >= 100 },
      { id: "expert-learner", name: "Învățător Expert", desc: "Studiază 200 carduri", icon: "🏆", xp: 300, condition: (stats) => stats.studiedCards >= 200 },
      { id: "master-student", name: "Student Maestru", desc: "Studiază 500 carduri", icon: "💎", xp: 500, condition: (stats) => stats.studiedCards >= 500 },
      { id: "legendary", name: "Legendar", desc: "Studiază toate cele 812 carduri", icon: "👑", xp: 1000, condition: (stats) => stats.studiedCards >= 812 },

      // Mastery achievements
      { id: "first-master", name: "Prima Stăpânire", desc: "Stăpânește primul card", icon: "⭐", xp: 50, condition: (stats) => stats.masteredCards >= 1 },
      { id: "mastery-10", name: "Stăpânire 10", desc: "Stăpânește 10 carduri", icon: "🌟", xp: 100, condition: (stats) => stats.masteredCards >= 10 },
      { id: "mastery-50", name: "Stăpânire 50", desc: "Stăpânește 50 carduri", icon: "✨", xp: 200, condition: (stats) => stats.masteredCards >= 50 },
      { id: "mastery-100", name: "Centul de Aur", desc: "Stăpânește 100 carduri", icon: "💯", xp: 400, condition: (stats) => stats.masteredCards >= 100 },

      // Module achievements
      { id: "m1-master", name: "Maestru M1", desc: "Stăpânește toate cardurile din M1", icon: "🧠", xp: 300, condition: (stats) => stats.modulesMastered?.M1 >= 123 },
      { id: "m2-master", name: "Maestru M2", desc: "Stăpânește toate cardurile din M2", icon: "🔬", xp: 300, condition: (stats) => stats.modulesMastered?.M2 >= 135 },
      { id: "m3-master", name: "Maestru M3", desc: "Stăpânește toate cardurile din M3", icon: "⚡", xp: 300, condition: (stats) => stats.modulesMastered?.M3 >= 133 },
      { id: "m4-master", name: "Maestru M4", desc: "Stăpânește toate cardurile din M4", icon: "🗺️", xp: 300, condition: (stats) => stats.modulesMastered?.M4 >= 156 },
      { id: "m5-master", name: "Maestru M5", desc: "Stăpânește toate cardurile din M5", icon: "🌱", xp: 300, condition: (stats) => stats.modulesMastered?.M5 >= 117 },
      { id: "m6-master", name: "Maestru M6", desc: "Stăpânește toate cardurile din M6", icon: "👁️", xp: 300, condition: (stats) => stats.modulesMastered?.M6 >= 146 },

      // Streak achievements
      { id: "streak-3", name: "Șir de 3 Zile", desc: "Studiază 3 zile consecutiv", icon: "🔥", xp: 100, condition: (stats) => stats.currentStreak >= 3 },
      { id: "streak-7", name: "Războinic Săptămânal", desc: "Studiază 7 zile consecutiv", icon: "🔥🔥", xp: 200, condition: (stats) => stats.currentStreak >= 7 },
      { id: "streak-14", name: "Focus de 2 Săptămâni", desc: "Studiază 14 zile consecutiv", icon: "🔥🔥🔥", xp: 400, condition: (stats) => stats.currentStreak >= 14 },
      { id: "streak-30", name: "Dedicație Lunară", desc: "Studiază 30 zile consecutiv", icon: "💪", xp: 800, condition: (stats) => stats.currentStreak >= 30 },
      { id: "streak-60", name: "Imparabil", desc: "Studiază 60 zile consecutiv", icon: "🌟", xp: 1500, condition: (stats) => stats.currentStreak >= 60 },

      // Special achievements
      { id: "night-owl", name: "Bufniță de Noapte", desc: "Studiază după 23:00", icon: "🌙", xp: 50, condition: (stats) => stats.nightStudy },
      { id: "early-bird", name: "Pasăre Matinală", desc: "Studiază înainte de 07:00", icon: "☀️", xp: 50, condition: (stats) => stats.earlyStudy },
      { id: "speed-demon", name: "Demon de Viteză", desc: "Studiază 100 carduri într-o zi", icon: "⚡", xp: 300, condition: (stats) => stats.cardsToday >= 100 },
      { id: "perfect-day", name: "Zi Perfectă", desc: "Atinge obiectivul zilnic", icon: "🎯", xp: 75, condition: (stats) => stats.dailyGoalReached }
    ];

    function App() {
      const [cards, setCards] = useState([]);
      const [loading, setLoading] = useState(true);
      const [view, setView] = useState('dashboard');
      const [studySession, setStudySession] = useState(null);
      const [currentCardIndex, setCurrentCardIndex] = useState(0);
      const [showAnswer, setShowAnswer] = useState(false);
      const [timer, setTimer] = useState(25 * 60);
      const [timerRunning, setTimerRunning] = useState(false);
      const [selectedModule, setSelectedModule] = useState(null);
      const [searchQuery, setSearchQuery] = useState('');
      const [showDifficult, setShowDifficult] = useState(false);

      // Mnemonics state
      const [selectedMnemonic, setSelectedMnemonic] = useState(null);
      const [mnemonicQuizMode, setMnemonicQuizMode] = useState(false);
      const [hiddenMnemonicParts, setHiddenMnemonicParts] = useState([]);

      // Gamification state
      const [xp, setXP] = useState(0);
      const [unlockedAchievements, setUnlockedAchievements] = useState([]);
      const [currentStreak, setCurrentStreak] = useState(0);
      const [lastStudyDate, setLastStudyDate] = useState(null);
      const [dailyGoal, setDailyGoal] = useState(20);
      const [cardsStudiedToday, setCardsStudiedToday] = useState(0);
      const [newAchievement, setNewAchievement] = useState(null); // For popup

      // Diagrams state
      const [selectedDiagram, setSelectedDiagram] = useState(null);
      const [diagramMode, setDiagramMode] = useState('view'); // 'view' or 'quiz'
      const [hiddenParts, setHiddenParts] = useState([]);
      const [completedDiagrams, setCompletedDiagrams] = useState([]);

      // Exam state
      const [examActive, setExamActive] = useState(false);
      const [examQuestions, setExamQuestions] = useState([]);
      const [examAnswers, setExamAnswers] = useState({});
      const [examTimeLeft, setExamTimeLeft] = useState(90 * 60); // 90 minutes
      const [examStartTime, setExamStartTime] = useState(null);
      const [examResults, setExamResults] = useState(null);
      const [examHistory, setExamHistory] = useState([]);
      const [flaggedQuestions, setFlaggedQuestions] = useState([]);
      const [currentExamQuestion, setCurrentExamQuestion] = useState(0);

      // Session tracking state
      const [sessionStartTime, setSessionStartTime] = useState(null);
      const [sessionStats, setSessionStats] = useState({ studied: 0, ratings: [], xpEarned: 0 });
      const [showSessionSummary, setShowSessionSummary] = useState(false);

      // Dark mode state
      const [darkMode, setDarkMode] = useState(false);

      const STORAGE_KEY = 'neuro-improved-v2';
      const GAMIFICATION_KEY = 'neuro-gamification-v3';
      const DIAGRAMS_KEY = 'neuro-diagrams-v3';
      const EXAM_HISTORY_KEY = 'neuro-exam-history-v3';

      // Load data on mount
      useEffect(() => {
        const loadData = async () => {
          try {
            const result = await storage.get(STORAGE_KEY);
            if (result?.value) {
              const saved = JSON.parse(result.value);
              // 🔥 FIX: Use content-based hash instead of index
              const merged = NEURO_CARDS.map((c, i) => {
                const cardHash = hashString(c.q + c.a);
                const savedCard = saved.find(s => s.hash === cardHash);
                return savedCard || {
                  id: `card-${i}`,
                  hash: cardHash,
                  question: c.q,
                  answer: c.a,
                  module: c.m,
                  interval: 0,
                  easeFactor: 2.5,
                  repetitions: 0,
                  nextReview: new Date().toISOString(),
                  lastReview: null,
                  isDifficult: false
                };
              });
              setCards(merged);
            } else {
              const initial = NEURO_CARDS.map((c, i) => ({
                id: `card-${i}`,
                hash: hashString(c.q + c.a),
                question: c.q,
                answer: c.a,
                module: c.m,
                interval: 0,
                easeFactor: 2.5,
                repetitions: 0,
                nextReview: new Date().toISOString(),
                lastReview: null,
                isDifficult: false
              }));
              setCards(initial);
              await storage.set(STORAGE_KEY, JSON.stringify(initial));
            }
          } catch (e) { console.error('Load error:', e); }
          setLoading(false);
        };
        loadData();
      }, []);

      const saveCards = async (nc) => {
        setCards(nc);
        await storage.set(STORAGE_KEY, JSON.stringify(nc));
      };

      // 🏆 Gamification Functions
      const getCurrentLevel = (xpValue) => {
        for (let i = LEVELS.length - 1; i >= 0; i--) {
          if (xpValue >= LEVELS[i].minXP) return LEVELS[i];
        }
        return LEVELS[0];
      };

      const getNextLevel = (xpValue) => {
        const currentLevel = getCurrentLevel(xpValue);
        const nextLevelIndex = LEVELS.findIndex(l => l.level === currentLevel.level) + 1;
        return nextLevelIndex < LEVELS.length ? LEVELS[nextLevelIndex] : null;
      };

      const addXP = async (amount, reason) => {
        const newXP = xp + amount;
        const oldLevel = getCurrentLevel(xp);
        const newLevel = getCurrentLevel(newXP);
        setXP(newXP);

        // Level up notification
        if (newLevel.level > oldLevel.level) {
          setTimeout(() => {
            alert(`🎉 Level Up! Acum ești ${newLevel.name} (Nivel ${newLevel.level})!`);
          }, 100);
        }

        // Save gamification data
        await saveGamificationData({ xp: newXP });
      };

      const checkAchievements = async () => {
        const stats = calculateStats();
        const newUnlocked = [];

        for (const achievement of ACHIEVEMENTS) {
          if (!unlockedAchievements.includes(achievement.id) && achievement.condition(stats)) {
            newUnlocked.push(achievement.id);
            setUnlockedAchievements(prev => [...prev, achievement.id]);
            await addXP(achievement.xp, `Achievement: ${achievement.name}`);

            // Show achievement popup
            setNewAchievement(achievement);
            setTimeout(() => setNewAchievement(null), 3000);
          }
        }

        if (newUnlocked.length > 0) {
          await saveGamificationData({ achievements: [...unlockedAchievements, ...newUnlocked] });
        }
      };

      const calculateStats = () => {
        const masteredCards = cards.filter(c => c.repetitions >= 3).length;
        const studiedCards = cards.filter(c => c.lastReview).length;

        const modulesMastered = {};
        ['M1', 'M2', 'M3', 'M4', 'M5', 'M6'].forEach(m => {
          modulesMastered[m] = cards.filter(c => c.module === m && c.repetitions >= 3).length;
        });

        const today = new Date().toISOString().split('T')[0];
        const studiedToday = cards.filter(c => c.lastReview && c.lastReview.startsWith(today)).length;

        const currentHour = new Date().getHours();
        const nightStudy = currentHour >= 23 || currentHour < 5;
        const earlyStudy = currentHour >= 5 && currentHour < 7;

        return {
          masteredCards,
          studiedCards,
          modulesMastered,
          currentStreak,
          cardsToday: cardsStudiedToday,
          dailyGoalReached: cardsStudiedToday >= dailyGoal,
          nightStudy,
          earlyStudy
        };
      };

      const updateStreak = async () => {
        const today = new Date().toISOString().split('T')[0];
        const yesterday = new Date(Date.now() - 86400000).toISOString().split('T')[0];

        if (lastStudyDate === today) {
          // Already studied today
          return;
        } else if (lastStudyDate === yesterday) {
          // Continue streak
          const newStreak = currentStreak + 1;
          setCurrentStreak(newStreak);
          await addXP(25, 'Streak day');
          setLastStudyDate(today);
          await saveGamificationData({ streak: newStreak, lastStudy: today });
        } else if (lastStudyDate !== today) {
          // Streak broken or first time
          setCurrentStreak(1);
          setLastStudyDate(today);
          await saveGamificationData({ streak: 1, lastStudy: today });
        }

        // Reset daily counter if new day
        if (lastStudyDate !== today) {
          setCardsStudiedToday(0);
        }
      };

      const saveGamificationData = async (updates) => {
        const data = {
          xp: updates.xp !== undefined ? updates.xp : xp,
          achievements: updates.achievements !== undefined ? updates.achievements : unlockedAchievements,
          streak: updates.streak !== undefined ? updates.streak : currentStreak,
          lastStudy: updates.lastStudy !== undefined ? updates.lastStudy : lastStudyDate,
          dailyGoal: updates.dailyGoal !== undefined ? updates.dailyGoal : dailyGoal,
          cardsToday: updates.cardsToday !== undefined ? updates.cardsToday : cardsStudiedToday
        };
        await storage.set(GAMIFICATION_KEY, JSON.stringify(data));
      };

      const loadGamificationData = async () => {
        try {
          const result = await storage.get(GAMIFICATION_KEY);
          if (result?.value) {
            const data = JSON.parse(result.value);
            setXP(data.xp || 0);
            setUnlockedAchievements(data.achievements || []);
            setCurrentStreak(data.streak || 0);
            setLastStudyDate(data.lastStudy || null);
            setDailyGoal(data.dailyGoal || 20);
            setCardsStudiedToday(data.cardsToday || 0);
          }
        } catch (e) {
          console.error('Gamification load error:', e);
        }
      };

      // Load gamification data on mount
      useEffect(() => {
        loadGamificationData();
        loadDiagramsData();
        loadExamHistory();
      }, []);

      // Load diagrams data
      const loadDiagramsData = async () => {
        try {
          const result = await storage.get(DIAGRAMS_KEY);
          if (result?.value) {
            const data = JSON.parse(result.value);
            setCompletedDiagrams(data || []);
          }
        } catch (e) {
          console.error('Diagrams load error:', e);
        }
      };

      // 📝 EXAM FUNCTIONS
      const loadExamHistory = async () => {
        try {
          const result = await storage.get(EXAM_HISTORY_KEY);
          if (result?.value) {
            const data = JSON.parse(result.value);
            setExamHistory(data || []);
          }
        } catch (e) {
          console.error('Exam history load error:', e);
        }
      };

      const generateExam = (numQuestions = 50) => {
        // Select cards proportionally from each module
        const moduleCounts = {
          M1: 123, M2: 135, M3: 133, M4: 156, M5: 117, M6: 146
        };
        const totalCards = Object.values(moduleCounts).reduce((a, b) => a + b, 0);

        const questionsPerModule = {};
        Object.keys(moduleCounts).forEach(m => {
          questionsPerModule[m] = Math.round((moduleCounts[m] / totalCards) * numQuestions);
        });

        // Adjust to exactly numQuestions
        const currentTotal = Object.values(questionsPerModule).reduce((a, b) => a + b, 0);
        if (currentTotal < numQuestions) {
          questionsPerModule.M4 += (numQuestions - currentTotal); // Add remainder to largest module
        }

        // Select questions
        const selectedQuestions = [];
        Object.keys(questionsPerModule).forEach(moduleId => {
          const moduleCards = cards.filter(c => c.module === moduleId);
          const shuffled = [...moduleCards].sort(() => Math.random() - 0.5);
          const selected = shuffled.slice(0, questionsPerModule[moduleId]);
          selectedQuestions.push(...selected);
        });

        // Shuffle final questions
        const shuffledQuestions = selectedQuestions.sort(() => Math.random() - 0.5);

        setExamQuestions(shuffledQuestions);
        setExamAnswers({});
        setFlaggedQuestions([]);
        setCurrentExamQuestion(0);
        setExamActive(true);
        setExamTimeLeft(90 * 60);
        setExamStartTime(new Date().toISOString());
        setExamResults(null);
        setView('exam');
      };

      const submitExam = async () => {
        const endTime = new Date().toISOString();
        const timeTaken = 90 * 60 - examTimeLeft;

        // Calculate score
        let correctAnswers = 0;
        const results = examQuestions.map((q, idx) => {
          const userAnswer = examAnswers[idx];
          const isCorrect = userAnswer === 'correct'; // Simplified - in reality would check actual answer
          if (isCorrect) correctAnswers++;
          return {
            question: q.question,
            answer: q.answer,
            userAnswer,
            correct: isCorrect,
            module: q.module
          };
        });

        const score = Math.round((correctAnswers / examQuestions.length) * 100);

        const examResult = {
          date: endTime,
          score,
          totalQuestions: examQuestions.length,
          correctAnswers,
          timeTaken,
          results
        };

        setExamResults(examResult);

        // Save to history
        const newHistory = [...examHistory, examResult];
        setExamHistory(newHistory);
        await storage.set(EXAM_HISTORY_KEY, JSON.stringify(newHistory));

        // Award XP
        await addXP(score * 2, 'Exam completed'); // 2 XP per point
        if (score === 100) {
          await addXP(500, 'Perfect exam!');
        }

        setExamActive(false);
      };

      // Exam timer
      useEffect(() => {
        let int;
        if (examActive && examTimeLeft > 0) {
          int = setInterval(() => {
            setExamTimeLeft(t => {
              if (t <= 1) {
                submitExam();
                return 0;
              }
              return t - 1;
            });
          }, 1000);
        }
        return () => clearInterval(int);
      }, [examActive, examTimeLeft]);

      // ⌨️ Keyboard Shortcuts
      useEffect(() => {
        const handleKeyPress = (e) => {
          // Only handle shortcuts in study view
          if (view !== 'study' || !studySession) return;

          // Prevent shortcuts when typing in input fields
          if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

          switch(e.key) {
            case ' ': // Space - reveal answer
              e.preventDefault();
              if (!showAnswer) setShowAnswer(true);
              break;
            case '1':
            case '2':
            case '3':
            case '4':
            case '5':
              e.preventDefault();
              if (showAnswer) rateCard(parseInt(e.key));
              break;
            case 'ArrowRight':
              e.preventDefault();
              if (currentCardIndex < studySession.length - 1 && showAnswer) {
                setCurrentCardIndex(currentCardIndex + 1);
                setShowAnswer(false);
              }
              break;
            case 'ArrowLeft':
              e.preventDefault();
              if (currentCardIndex > 0) {
                setCurrentCardIndex(currentCardIndex - 1);
                setShowAnswer(false);
              }
              break;
            case 'f':
            case 'F':
              e.preventDefault();
              toggleDifficult();
              break;
          }
        };

        window.addEventListener('keydown', handleKeyPress);
        return () => window.removeEventListener('keydown', handleKeyPress);
      }, [view, studySession, showAnswer, currentCardIndex]);

      // Timer Logic
      useEffect(() => {
        let int;
        if (timerRunning && timer > 0) int = setInterval(() => setTimer(t => t - 1), 1000);
        else if (timer === 0 && timerRunning) {
          setTimerRunning(false);
          setTimer(5 * 60);
          alert('🍅 Pomodoro! Pauză 5 min.');
        }
        return () => clearInterval(int);
      }, [timerRunning, timer]);

      const startStudy = (moduleId, onlyDue = true) => {
        let mc = cards.filter(c => c.module === moduleId);
        if (onlyDue) {
          const due = getCardsForReview(mc);
          mc = due.length > 0 ? due : mc.slice(0, 20);
        }
        setStudySession([...mc].sort(() => Math.random() - 0.5));
        setSelectedModule(moduleId);
        setCurrentCardIndex(0);
        setShowAnswer(false);

        // Initialize session tracking
        setSessionStartTime(Date.now());
        setSessionStats({ studied: 0, ratings: [], xpEarned: 0 });

        setView('study');
      };

      const rateCard = async (q) => {
        const card = studySession[currentCardIndex];
        const updated = calculateNextReview(card, q);
        const nc = cards.map(c => c.hash === card.hash ? updated : c);
        await saveCards(nc);

        // 🏆 Gamification: Award XP
        const xpBeforeCard = xp;
        await addXP(10, 'Studied card');
        let xpGained = 10;

        // Update daily counter
        const newCardsToday = cardsStudiedToday + 1;
        setCardsStudiedToday(newCardsToday);
        await saveGamificationData({ cardsToday: newCardsToday });

        // Check if card was just mastered (reached 3 repetitions)
        if (updated.repetitions === 3 && card.repetitions < 3) {
          await addXP(50, 'Mastered card');
          xpGained += 50;
        }

        // Update streak
        await updateStreak();

        // Check for achievements
        await checkAchievements();

        // Track session stats
        setSessionStats(prev => ({
          studied: prev.studied + 1,
          ratings: [...prev.ratings, q],
          xpEarned: prev.xpEarned + xpGained
        }));

        if (currentCardIndex < studySession.length - 1) {
          setCurrentCardIndex(currentCardIndex + 1);
          setShowAnswer(false);
        } else {
          // Session complete - show summary
          setStudySession(null);

          // Check daily goal completion
          if (newCardsToday >= dailyGoal) {
            await addXP(75, 'Daily goal reached');
          }

          setShowSessionSummary(true);
        }
      };

      const toggleDifficult = async () => {
        const card = studySession[currentCardIndex];
        const updated = { ...card, isDifficult: !card.isDifficult };
        const nc = cards.map(c => c.hash === card.hash ? updated : c);
        await saveCards(nc);
        // Update the study session too so UI reflects the change
        const updatedSession = studySession.map(c => c.hash === card.hash ? updated : c);
        setStudySession(updatedSession);
      };

      const resetProgress = async () => {
        if (!confirm('ATENȚIE: Resetezi tot progresul?')) return;
        const reset = cards.map(c => ({
          ...c,
          interval: 0,
          easeFactor: 2.5,
          repetitions: 0,
          nextReview: new Date().toISOString(),
          lastReview: null
        }));
        await saveCards(reset);
        alert('Progres resetat.');
      };

      const exportProgress = () => {
        const dataStr = JSON.stringify(cards, null, 2);
        const dataBlob = new Blob([dataStr], { type: 'application/json' });
        const url = URL.createObjectURL(dataBlob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `neuro-backup-${new Date().toISOString().split('T')[0]}.json`;
        link.click();
      };

      const importProgress = () => {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = '.json';
        input.onchange = async (e) => {
          const file = e.target.files[0];
          const text = await file.text();
          const imported = JSON.parse(text);
          await saveCards(imported);
          alert('✅ Progres importat cu succes!');
        };
        input.click();
      };

      const formatTimer = (s) => `${Math.floor(s/60).toString().padStart(2,'0')}:${(s%60).toString().padStart(2,'0')}`;

      const getModuleStats = (mid) => {
        const mc = cards.filter(c => c.module === mid);
        const due = getCardsForReview(mc);
        const mastered = mc.filter(c => c.repetitions >= 3);
        return {
          total: mc.length,
          due: due.length,
          mastered: mastered.length,
          progress: mc.length ? Math.round((mastered.length / mc.length) * 100) : 0
        };
      };

      // Search filtered cards
      const filteredCards = useMemo(() => {
        if (!searchQuery) return cards;
        const q = searchQuery.toLowerCase();
        return cards.filter(c =>
          c.question.toLowerCase().includes(q) ||
          c.answer.toLowerCase().includes(q)
        );
      }, [cards, searchQuery]);

      if (loading) return <div style={S.container}><div style={S.loading}>Se încarcă baza de date ({NEURO_CARDS.length} carduri)...</div></div>;

      // STUDY VIEW
      if (view === 'study' && studySession?.length > 0) {
        const card = studySession[currentCardIndex];
        const mod = MODULES.find(m => m.id === card.module);
        return (
          <div style={S.container}>
            <div style={S.studyHeader}>
              <button onClick={() => { setStudySession(null); setView('dashboard'); }} style={S.backBtn}>← Înapoi</button>
              <span style={S.studyProgress}>{currentCardIndex + 1}/{studySession.length}</span>
              <span style={{...S.badge, backgroundColor: mod?.color}}>{mod?.name}</span>
            </div>
            <div style={S.cardContainer}>
              <div style={S.flashcard} onClick={() => setShowAnswer(true)}>
                <div style={S.cardLabel}>ÎNTREBARE</div>
                <div style={S.cardQuestion}>{card.question}</div>
                {showAnswer ? (
                  <><div style={{...S.cardLabel, marginTop: 20}}>RĂSPUNS</div><div style={S.cardAnswer}>{card.answer}</div></>
                ) : <div style={S.tapHint}>Apasă pentru răspuns</div>}
              </div>
              <button
                onClick={toggleDifficult}
                style={{...S.secondaryBtn, marginTop: 12, backgroundColor: card.isDifficult ? '#fbbf24' : '#fff'}}
              >
                {card.isDifficult ? '⭐ Marcat ca dificil' : '☆ Marchează ca dificil'}
              </button>
              {showAnswer && (
                <div style={S.ratingContainer}>
                  <div style={{display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8, marginBottom: 8}}>
                    <p style={S.ratingLabel}>Cât de bine ai știut?</p>
                    <span style={S.progressBadge}>
                      {card.repetitions}/3 repetări
                    </span>
                  </div>
                  <div style={S.ratingButtons}>
                    <button onClick={() => rateCard(1)} style={{...S.rateBtn, backgroundColor: '#ef4444'}}>Nu știam</button>
                    <button onClick={() => rateCard(3)} style={{...S.rateBtn, backgroundColor: '#f59e0b'}}>Greu</button>
                    <button onClick={() => rateCard(4)} style={{...S.rateBtn, backgroundColor: '#22c55e'}}>Bine</button>
                    <button onClick={() => rateCard(5)} style={{...S.rateBtn, backgroundColor: '#06b6d4'}}>Ușor</button>
                  </div>
                  <p style={S.helpText}>💡 3+ repetări corecte = card stăpânit! "Nu știam" resetează progresul.</p>
                  <div style={{marginTop: 12, padding: 12, backgroundColor: '#f8fafc', borderRadius: 8, fontSize: 12, color: '#64748b'}}>
                    ⌨️ Scurtături: <strong>Spațiu</strong> = arată răspuns · <strong>1-5</strong> = rating · <strong>F</strong> = marchează dificil · <strong>←→</strong> = navighează
                  </div>
                </div>
              )}
            </div>
          </div>
        );
      }

      // SEARCH VIEW
      if (view === 'search') {
        return (
          <div style={S.container}>
            <div style={S.studyHeader}>
              <button onClick={() => setView('dashboard')} style={S.backBtn}>← Înapoi</button>
            </div>
            <div style={{marginBottom: 16}}>
              <input
                type="text"
                placeholder="Caută în întrebări și răspunsuri..."
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
                style={S.searchInput}
              />
            </div>
            <div style={S.searchResults}>
              {filteredCards.length === 0 && <p style={S.noResults}>Nu s-au găsit rezultate</p>}
              {filteredCards.map(card => {
                const mod = MODULES.find(m => m.id === card.module);
                return (
                  <div key={card.id} style={S.searchCard}>
                    <div style={{...S.badge, backgroundColor: mod?.color, marginBottom: 8}}>{mod?.name}</div>
                    <div style={S.searchQ}>{card.question}</div>
                    <div style={S.searchA}>{card.answer}</div>
                    <div style={S.searchMeta}>
                      {card.isDifficult && <span style={S.difficultBadge}>⭐ Dificil</span>}
                      <span>Repetări: {card.repetitions}</span>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        );
      }

      // DIAGRAMS VIEW
      if (view === 'diagrams') {
        if (selectedDiagram) {
          const diagram = DIAGRAMS.find(d => d.id === selectedDiagram);
          return (
            <div style={S.container}>
              <div style={S.studyHeader}>
                <button onClick={() => { setSelectedDiagram(null); setDiagramMode('view'); setHiddenParts([]); }} style={S.backBtn}>
                  ← Înapoi la diagrame
                </button>
                <span style={{fontSize: 18, fontWeight: 600}}>{diagram.title}</span>
              </div>

              <div style={{marginBottom: 20, display: 'flex', gap: 10}}>
                <button
                  onClick={() => {
                    setDiagramMode('view');
                    setHiddenParts([]);
                  }}
                  style={{
                    ...S.secondaryBtn,
                    flex: 1,
                    backgroundColor: diagramMode === 'view' ? '#dbeafe' : '#fff'
                  }}
                >
                  👁️ Vizualizare
                </button>
                <button
                  onClick={() => {
                    setDiagramMode('quiz');
                    setHiddenParts(diagram.parts.map(p => p.id));
                  }}
                  style={{
                    ...S.secondaryBtn,
                    flex: 1,
                    backgroundColor: diagramMode === 'quiz' ? '#fef3c7' : '#fff'
                  }}
                >
                  🧠 Testează-te
                </button>
              </div>

              <div
                style={{
                  backgroundColor: '#fff',
                  borderRadius: 12,
                  padding: 20,
                  marginBottom: 20,
                  border: '2px solid #e2e8f0'
                }}
                dangerouslySetInnerHTML={{ __html: diagram.svg }}
              />

              <div style={{display: 'grid', gap: 12}}>
                {diagram.parts.map(part => {
                  const isHidden = hiddenParts.includes(part.id);
                  return (
                    <div
                      key={part.id}
                      onClick={() => {
                        if (diagramMode === 'quiz') {
                          setHiddenParts(prev =>
                            prev.includes(part.id)
                              ? prev.filter(id => id !== part.id)
                              : [...prev, part.id]
                          );
                        }
                      }}
                      style={{
                        backgroundColor: isHidden ? '#fef3c7' : '#f8fafc',
                        border: '2px solid',
                        borderColor: isHidden ? '#fbbf24' : '#e2e8f0',
                        borderRadius: 12,
                        padding: 16,
                        cursor: diagramMode === 'quiz' ? 'pointer' : 'default',
                        transition: 'all 0.2s'
                      }}
                    >
                      <div style={{
                        fontSize: 16,
                        fontWeight: 700,
                        color: '#334155',
                        marginBottom: 6
                      }}>
                        {part.label}
                      </div>
                      {!isHidden && (
                        <div style={{fontSize: 14, color: '#64748b'}}>
                          {part.desc}
                        </div>
                      )}
                      {isHidden && diagramMode === 'quiz' && (
                        <div style={{fontSize: 13, color: '#94a3b8', fontStyle: 'italic'}}>
                          Click pentru răspuns
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>

              {diagramMode === 'quiz' && hiddenParts.length === 0 && (
                <button
                  onClick={async () => {
                    if (!completedDiagrams.includes(diagram.id)) {
                      setCompletedDiagrams(prev => [...prev, diagram.id]);
                      await addXP(100, 'Completed diagram');
                      await storage.set(DIAGRAMS_KEY, JSON.stringify([...completedDiagrams, diagram.id]));
                    }
                    setSelectedDiagram(null);
                    setDiagramMode('view');
                  }}
                  style={{
                    ...S.primaryBtn,
                    width: '100%',
                    marginTop: 20,
                    padding: '14px',
                    backgroundColor: '#22c55e'
                  }}
                >
                  ✅ Completează diagrama (+100 XP)
                </button>
              )}
            </div>
          );
        }

        return (
          <div style={S.container}>
            <div style={S.studyHeader}>
              <button onClick={() => setView('dashboard')} style={S.backBtn}>← Înapoi</button>
              <span style={{fontSize: 18, fontWeight: 600}}>🎨 Diagrame Interactive</span>
            </div>

            <div style={{marginBottom: 20}}>
              <p style={{fontSize: 14, color: '#64748b', textAlign: 'center'}}>
                Explorează structuri neuroanatomice prin diagrame interactive. Click pe o diagramă pentru a începe.
              </p>
            </div>

            <div style={{display: 'grid', gap: 12}}>
              {DIAGRAMS.map(diagram => {
                const isCompleted = completedDiagrams.includes(diagram.id);
                const module = MODULES.find(m => m.id === diagram.module);
                return (
                  <div
                    key={diagram.id}
                    onClick={() => setSelectedDiagram(diagram.id)}
                    style={{
                      backgroundColor: isCompleted ? '#f0fdf4' : '#fff',
                      border: '2px solid',
                      borderColor: isCompleted ? '#22c55e' : '#e2e8f0',
                      borderRadius: 12,
                      padding: 16,
                      cursor: 'pointer',
                      transition: 'all 0.2s'
                    }}
                  >
                    <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8}}>
                      <div style={{fontSize: 16, fontWeight: 700, color: '#334155'}}>
                        {diagram.title}
                      </div>
                      {isCompleted && <span style={{fontSize: 20}}>✅</span>}
                    </div>
                    <div style={{...S.badge, backgroundColor: module?.color, display: 'inline-block', marginBottom: 8}}>
                      {module?.name}
                    </div>
                    <div style={{fontSize: 13, color: '#64748b'}}>
                      {diagram.parts.length} părți identificabile
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        );
      }

      // ACHIEVEMENTS VIEW
      if (view === 'achievements') {
        const stats = calculateStats();
        return (
          <div style={S.container}>
            <div style={S.studyHeader}>
              <button onClick={() => setView('dashboard')} style={S.backBtn}>← Înapoi</button>
              <span style={{fontSize: 18, fontWeight: 600}}>🏆 Realizări</span>
            </div>

            <div style={{marginBottom: 20, textAlign: 'center'}}>
              <div style={{fontSize: 32, fontWeight: 700, color: '#334155', marginBottom: 8}}>
                {unlockedAchievements.length} / {ACHIEVEMENTS.length}
              </div>
              <div style={{fontSize: 14, color: '#64748b'}}>
                {Math.round((unlockedAchievements.length / ACHIEVEMENTS.length) * 100)}% completat
              </div>
            </div>

            <div style={{display: 'grid', gap: 12}}>
              {ACHIEVEMENTS.map(achievement => {
                const isUnlocked = unlockedAchievements.includes(achievement.id);
                const isAvailable = !isUnlocked && achievement.condition(stats);

                return (
                  <div
                    key={achievement.id}
                    style={{
                      backgroundColor: isUnlocked ? '#fef3c7' : '#f8fafc',
                      border: '2px solid',
                      borderColor: isUnlocked ? '#fbbf24' : '#e2e8f0',
                      borderRadius: 12,
                      padding: 16,
                      opacity: isUnlocked ? 1 : 0.6,
                      transition: 'all 0.2s'
                    }}
                  >
                    <div style={{display: 'flex', alignItems: 'center', gap: 12}}>
                      <div style={{
                        fontSize: 40,
                        filter: isUnlocked ? 'none' : 'grayscale(100%)'
                      }}>
                        {achievement.icon}
                      </div>
                      <div style={{flex: 1}}>
                        <div style={{
                          fontSize: 16,
                          fontWeight: 700,
                          color: isUnlocked ? '#92400e' : '#64748b',
                          marginBottom: 4
                        }}>
                          {achievement.name}
                          {isUnlocked && <span style={{marginLeft: 8, fontSize: 18}}>✅</span>}
                          {isAvailable && <span style={{marginLeft: 8, fontSize: 14, color: '#22c55e'}}>📍 Aproape!</span>}
                        </div>
                        <div style={{
                          fontSize: 13,
                          color: isUnlocked ? '#a16207' : '#94a3b8',
                          marginBottom: 4
                        }}>
                          {achievement.desc}
                        </div>
                        <div style={{
                          fontSize: 12,
                          fontWeight: 600,
                          color: '#ea580c'
                        }}>
                          +{achievement.xp} XP
                        </div>
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        );
      }

      // MNEMONICS VIEW
      if (view === 'mnemonics') {
        return (
          <div style={S.container}>
            <div style={S.studyHeader}>
              <button onClick={() => setView('dashboard')} style={S.backBtn}>← Înapoi</button>
              <span style={{fontSize: 18, fontWeight: 600}}>🧩 Mnemonice</span>
            </div>
            <div style={{marginBottom: 20}}>
              <p style={{fontSize: 14, color: '#64748b', textAlign: 'center'}}>
                Memory aids pentru concepte cheie. Click pe un mnemonic pentru detalii.
              </p>
            </div>
            <div style={{display: 'flex', flexDirection: 'column', gap: 12}}>
              {MNEMONICS.map(mnem => {
                const mod = MODULES.find(m => m.id === mnem.module);
                const isExpanded = selectedMnemonic === mnem.id;
                return (
                  <div key={mnem.id} style={{
                    border: '2px solid #e2e8f0',
                    borderRadius: 12,
                    padding: 16,
                    backgroundColor: isExpanded ? '#f8fafc' : '#fff',
                    cursor: 'pointer',
                    transition: 'all 0.2s'
                  }} onClick={() => setSelectedMnemonic(isExpanded ? null : mnem.id)}>
                    <div style={{display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 8}}>
                      <div style={{fontWeight: 600, fontSize: 16}}>{mnem.topic}</div>
                      <div style={{...S.badge, backgroundColor: mod?.color}}>{mod?.name}</div>
                    </div>
                    <div style={{
                      fontSize: 18,
                      fontWeight: 700,
                      color: '#8b5cf6',
                      marginBottom: 12,
                      fontFamily: 'monospace',
                      letterSpacing: '0.5px'
                    }}>
                      {mnem.mnemonic}
                    </div>
                    {isExpanded && (
                      <>
                        <div style={{borderTop: '1px solid #e2e8f0', paddingTop: 12, marginTop: 8}}>
                          <div style={{fontSize: 13, fontWeight: 600, color: '#64748b', marginBottom: 8}}>
                            Breakdown:
                          </div>
                          {Object.entries(mnem.breakdown).map(([letter, meaning]) => (
                            <div key={letter} style={{
                              padding: '8px 12px',
                              marginBottom: 6,
                              backgroundColor: '#fff',
                              borderRadius: 8,
                              border: '1px solid #e2e8f0',
                              display: 'flex',
                              gap: 12
                            }}>
                              <span style={{
                                fontWeight: 700,
                                color: '#8b5cf6',
                                minWidth: 80,
                                fontFamily: 'monospace'
                              }}>{letter}</span>
                              <span style={{color: '#334155'}}>{meaning}</span>
                            </div>
                          ))}
                        </div>
                        <div style={{marginTop: 12, display: 'flex', gap: 8}}>
                          <button
                            onClick={(e) => {
                              e.stopPropagation();
                              setMnemonicQuizMode(!mnemonicQuizMode);
                              setHiddenMnemonicParts(mnemonicQuizMode ? [] : Object.keys(mnem.breakdown));
                            }}
                            style={{
                              ...S.secondaryBtn,
                              flex: 1,
                              backgroundColor: mnemonicQuizMode ? '#fef3c7' : '#fff'
                            }}
                          >
                            {mnemonicQuizMode ? '👁️ Arată tot' : '🧠 Testează-te'}
                          </button>
                        </div>
                        {mnemonicQuizMode && (
                          <div style={{marginTop: 12, padding: 12, backgroundColor: '#fef3c7', borderRadius: 8}}>
                            <div style={{fontSize: 13, fontWeight: 600, marginBottom: 8}}>
                              Quiz Mode: Click pe litere pentru a dezvălui răspunsul
                            </div>
                            {Object.entries(mnem.breakdown).map(([letter, meaning]) => {
                              const isHidden = hiddenMnemonicParts.includes(letter);
                              return (
                                <div
                                  key={letter}
                                  onClick={(e) => {
                                    e.stopPropagation();
                                    setHiddenMnemonicParts(prev =>
                                      prev.includes(letter)
                                        ? prev.filter(l => l !== letter)
                                        : [...prev, letter]
                                    );
                                  }}
                                  style={{
                                    padding: '8px 12px',
                                    marginBottom: 6,
                                    backgroundColor: '#fff',
                                    borderRadius: 8,
                                    cursor: 'pointer',
                                    border: isHidden ? '2px dashed #a855f7' : '1px solid #e2e8f0'
                                  }}
                                >
                                  <span style={{fontWeight: 700, color: '#8b5cf6', fontFamily: 'monospace'}}>
                                    {letter}
                                  </span>
                                  {' → '}
                                  {isHidden ? (
                                    <span style={{color: '#94a3b8', fontStyle: 'italic'}}>??? (click pentru răspuns)</span>
                                  ) : (
                                    <span style={{color: '#334155'}}>{meaning}</span>
                                  )}
                                </div>
                              );
                            })}
                          </div>
                        )}
                      </>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        );
      }

      // ANALYTICS VIEW
      if (view === 'analytics') {
        // Calculate analytics
        const moduleAnalytics = MODULES.map(mod => {
          const moduleCards = cards.filter(c => c.module === mod.id);
          const mastered = moduleCards.filter(c => c.repetitions >= 3).length;
          const learning = moduleCards.filter(c => c.repetitions > 0 && c.repetitions < 3).length;
          const newCards = moduleCards.filter(c => c.repetitions === 0).length;
          const avgEaseFactor = moduleCards.reduce((sum, c) => sum + c.easeFactor, 0) / moduleCards.length;
          const progressPercent = Math.round((mastered / moduleCards.length) * 100);

          return {
            module: mod,
            total: moduleCards.length,
            mastered,
            learning,
            newCards,
            avgEaseFactor: avgEaseFactor.toFixed(2),
            progressPercent
          };
        });

        // Detect leeches (cards failed many times - low ease factor)
        const leeches = cards.filter(c => c.easeFactor < 2.0 && c.repetitions > 2);

        // Overall stats
        const totalStudied = cards.filter(c => c.lastReview).length;
        const totalMastered = cards.filter(c => c.repetitions >= 3).length;
        const overallProgress = Math.round((totalMastered / cards.length) * 100);

        // Predict score based on mastery
        const predictedScore = Math.min(100, Math.round(40 + (overallProgress * 0.6)));

        return (
          <div style={S.container}>
            <div style={S.studyHeader}>
              <button onClick={() => setView('dashboard')} style={S.backBtn}>← Înapoi</button>
              <span style={{fontSize: 18, fontWeight: 600}}>📊 Analytics</span>
            </div>

            {/* Overall Stats */}
            <div style={{
              backgroundColor: '#fff',
              border: '2px solid #e2e8f0',
              borderRadius: 12,
              padding: 20,
              marginBottom: 20
            }}>
              <h3 style={{fontSize: 16, fontWeight: 700, color: '#334155', marginBottom: 16}}>
                📈 Progres General
              </h3>
              <div style={{display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 12, marginBottom: 16}}>
                <div style={{textAlign: 'center'}}>
                  <div style={{fontSize: 24, fontWeight: 700, color: '#3b82f6'}}>{totalStudied}</div>
                  <div style={{fontSize: 12, color: '#64748b'}}>Studiate</div>
                </div>
                <div style={{textAlign: 'center'}}>
                  <div style={{fontSize: 24, fontWeight: 700, color: '#22c55e'}}>{totalMastered}</div>
                  <div style={{fontSize: 12, color: '#64748b'}}>Stăpânite</div>
                </div>
                <div style={{textAlign: 'center'}}>
                  <div style={{fontSize: 24, fontWeight: 700, color: '#f59e0b'}}>{overallProgress}%</div>
                  <div style={{fontSize: 12, color: '#64748b'}}>Progres</div>
                </div>
              </div>
              <div style={{
                backgroundColor: '#f0fdf4',
                border: '2px solid #22c55e',
                borderRadius: 8,
                padding: 12,
                textAlign: 'center'
              }}>
                <div style={{fontSize: 14, fontWeight: 600, color: '#15803d', marginBottom: 4}}>
                  🎯 Scor Estimat Examen
                </div>
                <div style={{fontSize: 32, fontWeight: 700, color: '#16a34a'}}>
                  {predictedScore}/100
                </div>
                <div style={{fontSize: 12, color: '#166534'}}>
                  Bazat pe progresul curent ({overallProgress}%)
                </div>
              </div>
            </div>

            {/* Module Heatmap */}
            <div style={{
              backgroundColor: '#fff',
              border: '2px solid #e2e8f0',
              borderRadius: 12,
              padding: 20,
              marginBottom: 20
            }}>
              <h3 style={{fontSize: 16, fontWeight: 700, color: '#334155', marginBottom: 16}}>
                🗺️ Heatmap Module
              </h3>
              {moduleAnalytics.map(mod => (
                <div key={mod.module.id} style={{marginBottom: 16}}>
                  <div style={{display: 'flex', justifyContent: 'space-between', marginBottom: 6}}>
                    <div style={{fontSize: 14, fontWeight: 600, color: '#334155'}}>
                      {mod.module.name}
                    </div>
                    <div style={{fontSize: 13, color: '#64748b'}}>
                      {mod.mastered}/{mod.total} ({mod.progressPercent}%)
                    </div>
                  </div>
                  <div style={{
                    width: '100%',
                    height: 24,
                    backgroundColor: '#f1f5f9',
                    borderRadius: 6,
                    overflow: 'hidden',
                    display: 'flex'
                  }}>
                    <div
                      style={{
                        width: `${(mod.mastered / mod.total) * 100}%`,
                        backgroundColor: '#22c55e',
                        transition: 'width 0.3s'
                      }}
                      title={`Stăpânite: ${mod.mastered}`}
                    />
                    <div
                      style={{
                        width: `${(mod.learning / mod.total) * 100}%`,
                        backgroundColor: '#fbbf24',
                        transition: 'width 0.3s'
                      }}
                      title={`În învățare: ${mod.learning}`}
                    />
                    <div
                      style={{
                        width: `${(mod.newCards / mod.total) * 100}%`,
                        backgroundColor: '#e2e8f0',
                        transition: 'width 0.3s'
                      }}
                      title={`Noi: ${mod.newCards}`}
                    />
                  </div>
                  <div style={{fontSize: 11, color: '#94a3b8', marginTop: 4}}>
                    Ease Factor mediu: {mod.avgEaseFactor}
                  </div>
                </div>
              ))}
              <div style={{display: 'flex', gap: 12, marginTop: 12, fontSize: 12}}>
                <div style={{display: 'flex', alignItems: 'center', gap: 4}}>
                  <div style={{width: 12, height: 12, backgroundColor: '#22c55e', borderRadius: 2}} />
                  <span style={{color: '#64748b'}}>Stăpânite</span>
                </div>
                <div style={{display: 'flex', alignItems: 'center', gap: 4}}>
                  <div style={{width: 12, height: 12, backgroundColor: '#fbbf24', borderRadius: 2}} />
                  <span style={{color: '#64748b'}}>În învățare</span>
                </div>
                <div style={{display: 'flex', alignItems: 'center', gap: 4}}>
                  <div style={{width: 12, height: 12, backgroundColor: '#e2e8f0', borderRadius: 2}} />
                  <span style={{color: '#64748b'}}>Noi</span>
                </div>
              </div>
            </div>

            {/* Leech Detection */}
            {leeches.length > 0 && (
              <div style={{
                backgroundColor: '#fef2f2',
                border: '2px solid #ef4444',
                borderRadius: 12,
                padding: 20,
                marginBottom: 20
              }}>

      // EXAM VIEW
      if (view === 'exam') {

                  <div style={{fontSize: 13, color: '#a16207'}}>

                <div style={{...S.badge, backgroundColor: MODULES.find(m => m.id === currentQuestion.module)?.color, marginBottom: 12}}>

      }

      // SESSION SUMMARY MODAL
      if (showSessionSummary) {

        const minutes = Math.floor(sessionDuration / 60);
        const seconds = sessionDuration % 60;
        const avgRating = sessionStats.ratings.length > 0

        return (
          <div style={{
            position: 'fixed',

                    return (
                      <div key={rating} style={{flex: 1, textAlign: 'center'}}>

                      </div>

                </div>

                  setShowSessionSummary(false);

                  padding: '14px',
                  backgroundColor: '#3b82f6',
                  color: '#fff',
                  border: 'none',
                  borderRadius: 12,
                  fontSize: 16,
                  fontWeight: 600,
                  cursor: 'pointer'
                }}
              >
                Înapoi la Dashboard
              </button>
            </div>
          </div>

      // DASHBOARD VIEW

      const totalMastered = cards.filter(c => c.repetitions >= 3).length;
      const difficultCards = cards.filter(c => c.isDifficult);

      // 🏆 Calculate gamification display values
      const currentLevel = getCurrentLevel(xp);
      const nextLevel = getNextLevel(xp);
      const xpProgress = nextLevel

      return (

              <button
                onClick={() => setDarkMode(!darkMode)}
                style={{
                  padding: '8px 16px',
                  borderRadius: 20,
                  border: darkMode ? '1px solid #404040' : '1px solid #e5e7eb',
                  backgroundColor: darkMode ? '#2d2d2d' : '#fff',
                  color: darkMode ? '#e5e5e5' : '#6b7280',
                  cursor: 'pointer',
                  fontSize: 14,
                  fontWeight: 500,
                  transition: 'all 0.3s'
                }}
              >
                {darkMode ? '☀️ Light' : '🌙 Dark'}
              </button>

            backgroundColor: '#fff',
            borderRadius: 12,

              <div style={{display: 'flex', alignItems: 'center', gap: 8}}>
                <div style={{
                  padding: '6px 12px',
                  borderRadius: 20,
                  backgroundColor: currentLevel.color,

                  fontSize: 14
                }}>

                </div>
                {currentStreak > 0 && (
                  <div style={{
                    padding: '6px 12px',
                    borderRadius: 20,
                    backgroundColor: '#fef3c7',
                    color: '#f59e0b',
                    fontWeight: 700,
                    fontSize: 14
                  }}>

              <div style={{
                width: '100%',
                height: 12,
                backgroundColor: '#e2e8f0',
                borderRadius: 6,
                overflow: 'hidden'

                <div style={{
                  width: `${xpProgress}%`,
                  height: '100%',

              <div style={{textAlign: 'center'}}>
                <div style={{fontSize: 24, fontWeight: 700, color: '#3b82f6'}}>{cardsStudiedToday}</div>

              <div style={{textAlign: 'center'}}>
                <div style={{fontSize: 24, fontWeight: 700, color: '#f59e0b'}}>{currentStreak}</div>

                <div style={{fontSize: 24, fontWeight: 700, color: '#a855f7'}}>{totalDue}</div>

              <div style={{fontSize: 48, marginBottom: 10}}>{newAchievement.icon}</div>
              <div style={{fontSize: 18, fontWeight: 700, color: '#92400e', marginBottom: 5}}>
                Realizare Deblocată!
              </div>
              <div style={{fontSize: 16, fontWeight: 600, color: '#78350f', marginBottom: 5}}>
                {newAchievement.name}
              </div>
              <div style={{fontSize: 13, color: '#a16207'}}>
                {newAchievement.desc}
              </div>
              <div style={{fontSize: 14, fontWeight: 700, color: '#ea580c', marginTop: 8}}>
                +{newAchievement.xp} XP
              </div>

          <div style={S.timerSection}>

            <div style={S.timerControls}>

            <div style={S.quickStat}><span style={S.quickStatValue}>{totalMastered}</span><span style={S.quickStatLabel}>stăpânite</span></div>
            <div style={S.quickStat}><span style={{...S.quickStatValue, color: '#fbbf24'}}>{difficultCards.length}</span><span style={S.quickStatLabel}>dificile</span></div>

              setStudySession([...difficultCards].sort(() => Math.random() - 0.5));

          </button>

          <div style={S.section}>
            <h2 style={S.sectionTitle}>Module</h2>
            <div style={S.modulesGrid}>
              {MODULES.map(mod => {
                const stats = getModuleStats(mod.id);
                return (
                  <div key={mod.id} style={S.moduleCard}>
                    <div style={{...S.moduleHeader, backgroundColor: mod.color}}>
                      <span style={S.moduleName}>{mod.name}</span>
                      <span style={S.moduleCount}>{stats.total}</span>
                    </div>
                    <div style={S.moduleBody}>
                      <div style={S.statsRow}>
                        <div style={S.stat}><span style={{...S.statValue, color: stats.due > 0 ? '#f59e0b' : '#22c55e'}}>{stats.due}</span><span style={S.statLabel}>due</span></div>
                        <div style={S.stat}><span style={S.statValue}>{stats.mastered}</span><span style={S.statLabel}>learned</span></div>
                        <div style={S.stat}><span style={S.statValue}>{stats.progress}%</span><span style={S.statLabel}>progres</span></div>
                      </div>
                      <div style={S.progressBar}><div style={{...S.progressFill, width: `${stats.progress}%`, backgroundColor: mod.color}} /></div>
                      <div style={S.moduleActions}>
                        <button onClick={() => startStudy(mod.id, true)} style={{...S.actionBtn, ...S.studyBtn}}>🎯 Învață</button>
                        <button onClick={() => startStudy(mod.id, false)} style={S.actionBtn}>📚 Toate</button>
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>

          <div style={S.footer}>
            <div style={{display: 'flex', gap: 8, justifyContent: 'center', flexWrap: 'wrap', marginBottom: 12}}>
              <button onClick={exportProgress} style={S.secondaryBtn}>📥 Export progres</button>
              <button onClick={importProgress} style={S.secondaryBtn}>📤 Import progres</button>
              <button onClick={resetProgress} style={S.secondaryBtn}>🔄 Reset progres</button>
            </div>
            <p style={S.footerText}>Improved v2.0 - Progres salvat automat în localStorage</p>
          </div>
        </div>
      );
    }

    const S = {
