<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stoicism: Philosophy for Modern Resilience</title>
    <link href="https://fonts.googleapis.com/css2?family=Quattrocento:wght@400;700&family=Oranienbaum&family=Quattrocento+Sans:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #C49A6C;
            --secondary: #5C6D67;
            --bg: #2B2B2B;
            --text: #E0DCD7;
            --accent: #A8A39D;
            --dark-bg: #1a1a1a;
        }

        body {
            font-family: 'Quattrocento Sans', sans-serif;
            background: var(--dark-bg);
            color: var(--text);
            overflow: hidden;
            height: 100vh;
        }

        .font-display {
            font-family: 'Quattrocento', serif;
        }

        .font-heading {
            font-family: 'Oranienbaum', serif;
        }

        /* Main Container */
        #app {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header Navigation */
        header {
            background: var(--bg);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary);
            z-index: 100;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary);
        }

        .controls {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .btn {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--text);
            padding: 0.5rem 1rem;
            cursor: pointer;
            border-radius: 4px;
            font-size: 0.9rem;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn:hover {
            background: var(--primary);
            color: var(--bg);
        }

        .slide-counter {
            color: var(--accent);
            font-size: 0.9rem;
            min-width: 80px;
            text-align: center;
        }

        /* Slide Container */
        .slide-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .slide {
            position: absolute;
            width: 100%;
            max-width: 1200px;
            height: calc(100% - 4rem);
            background: var(--bg);
            border-radius: 12px;
            padding: 3rem;
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transform: translateX(100%);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
            overflow-x: hidden;
        }

        .slide.active {
            opacity: 1;
            transform: translateX(0);
            z-index: 10;
        }

        .slide.prev {
            opacity: 0;
            transform: translateX(-100%);
        }

        /* Slide Styles */
        .slide h1 {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            line-height: 1.2;
        }

        .slide h2 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: var(--primary);
        }

        .slide h3 {
            font-size: 1.8rem;
            margin-bottom: 0.75rem;
        }

        .slide h4 {
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
        }

        .slide p {
            line-height: 1.6;
            margin-bottom: 1rem;
        }

        .divider {
            height: 3px;
            width: 100px;
            background: var(--primary);
            margin: 1rem 0;
        }

        /* Cover Slide */
        .slide.cover {
            background: linear-gradient(135deg, var(--bg) 0%, #1a1a1a 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 4rem;
        }

        .slide.cover h1 {
            font-size: 5rem;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .slide.cover .subtitle {
            font-size: 2.5rem;
            color: var(--primary);
            margin-bottom: 2rem;
        }

        .slide.cover .tagline {
            font-size: 1.5rem;
            color: var(--accent);
        }

        /* Navigation Arrows */
        .nav-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(196, 154, 108, 0.2);
            border: 2px solid var(--primary);
            color: var(--text);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            z-index: 50;
        }

        .nav-arrow:hover {
            background: var(--primary);
            transform: translateY(-50%) scale(1.1);
        }

        .nav-arrow.left {
            left: 2rem;
        }

        .nav-arrow.right {
            right: 2rem;
        }

        .nav-arrow:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .nav-arrow:disabled:hover {
            background: rgba(196, 154, 108, 0.2);
            transform: translateY(-50%);
        }

        /* Progress Bar */
        .progress-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: rgba(196, 154, 108, 0.2);
            z-index: 100;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Grid Layouts */
        .grid-2 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
            margin: 1.5rem 0;
        }

        .grid-4 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin: 1.5rem 0;
        }

        .card {
            background: rgba(58, 58, 58, 0.4);
            padding: 1.5rem;
            border-radius: 8px;
            border-left: 4px solid var(--primary);
        }

        .card.secondary {
            border-left-color: var(--secondary);
        }

        .card-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
            font-size: 1.5rem;
        }

        .card-icon.secondary {
            background: var(--secondary);
        }

        /* Quote Boxes */
        .quote {
            background: rgba(196, 154, 108, 0.1);
            border-left: 4px solid var(--primary);
            padding: 1.5rem;
            margin: 1.5rem 0;
            font-style: italic;
            border-radius: 4px;
        }

        .quote-author {
            margin-top: 1rem;
            color: var(--primary);
            font-weight: bold;
        }

        /* Lists */
        ul, ol {
            margin-left: 2rem;
            margin-bottom: 1rem;
        }

        li {
            margin-bottom: 0.5rem;
            line-height: 1.6;
        }

        /* Responsive */
        @media (max-width: 768px) {
            header {
                padding: 0.75rem 1rem;
            }

            .logo {
                font-size: 1.2rem;
            }

            .slide {
                padding: 1.5rem;
            }

            .slide h1 {
                font-size: 2.5rem;
            }

            .slide h2 {
                font-size: 1.8rem;
            }

            .slide.cover h1 {
                font-size: 3rem;
            }

            .nav-arrow {
                width: 40px;
                height: 40px;
            }

            .nav-arrow.left {
                left: 1rem;
            }

            .nav-arrow.right {
                right: 1rem;
            }

            .btn span {
                display: none;
            }
        }

        /* Overview/Thumbnail Mode */
        .overview-mode {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            padding: 2rem;
            overflow-y: auto;
        }

        .overview-mode.active {
            display: block;
        }

        .overview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.5rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .overview-slide {
            background: var(--bg);
            padding: 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
        }

        .overview-slide:hover {
            border-color: var(--primary);
            transform: scale(1.05);
        }

        .overview-slide.current {
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(196, 154, 108, 0.5);
        }

        .overview-number {
            color: var(--primary);
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        .overview-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        .overview-close {
            position: fixed;
            top: 2rem;
            right: 2rem;
            z-index: 1001;
        }

        /* Fullscreen styles */
        .fullscreen-active header {
            display: none;
        }

        .fullscreen-active .slide-container {
            padding: 0;
        }

        .fullscreen-active .slide {
            max-width: 100%;
            height: 100%;
            border-radius: 0;
        }

        /* Loading Animation */
        .loading {
            text-align: center;
            padding: 2rem;
        }

        .spinner {
            border: 3px solid rgba(196, 154, 108, 0.3);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="app">
        <header>
            <div class="logo font-display">Stoicism</div>
            <div class="controls">
                <div class="slide-counter">
                    <span id="current-slide">1</span> / <span id="total-slides">19</span>
                </div>
                <button class="btn" id="overview-btn" title="Overview (Esc)">
                    <i class="fas fa-th"></i>
                    <span>Overview</span>
                </button>
                <button class="btn" id="fullscreen-btn" title="Fullscreen (F)">
                    <i class="fas fa-expand"></i>
                    <span>Fullscreen</span>
                </button>
                <button class="btn" id="autoplay-btn" title="Auto-play (A)">
                    <i class="fas fa-play"></i>
                    <span>Auto-play</span>
                </button>
            </div>
        </header>

        <div class="slide-container" id="slide-container">
            <div class="loading">
                <div class="spinner"></div>
                <p>Loading presentation...</p>
            </div>

            <button class="nav-arrow left" id="prev-btn" title="Previous (←)">
                <i class="fas fa-chevron-left"></i>
            </button>
            <button class="nav-arrow right" id="next-btn" title="Next (→)">
                <i class="fas fa-chevron-right"></i>
            </button>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
        </div>

        <div class="overview-mode" id="overview-mode">
            <button class="btn overview-close" id="overview-close">
                <i class="fas fa-times"></i> Close
            </button>
            <div class="overview-grid" id="overview-grid"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
